name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  TZ: UTC

jobs:

  server-unit:
    name: Server - Lint, Typecheck, Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test --testPathPattern=test/unit --passWithNoTests

  server-integration:
    name: Server - Integration Tests
    runs-on: ubuntu-latest
    needs: server-unit
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swiftcpq_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: swiftcpq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://swiftcpq_test:test_password@localhost:5432/swiftcpq_test
      JWT_SECRET: test_jwt_secret_at_least_32_chars_ok
      JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_ok
      INTERNAL_SERVICE_TOKEN: test_internal_service_token
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm test --testPathPattern=test/integration --passWithNoTests

  client:
    name: Client - Typecheck, Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec vue-tsc -b --noEmit
      - run: pnpm test --passWithNoTests

  templater:
    name: Templater - Lint, Typecheck, Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templater
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test --passWithNoTests
