services:
  postgres:
    image: postgres:16
    container_name: swiftcpq-postgres-dev
    environment:
      POSTGRES_USER: swiftcpq
      POSTGRES_PASSWORD: swiftcpq
      POSTGRES_DB: swiftcpq_dev
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftcpq -d swiftcpq_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_dev:
